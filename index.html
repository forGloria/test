<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>猜歌競速</title>
<style>
:root{
  --bg:#140D1E; --card:#1E1530; --card2:#271B3D; --line:#3A2B54;
  --ink:#F0EAF8; --dim:#9C8FB3;
  --violet:#A855F7; --violet-d:#6D3FA8;
  --gold:#E8B04B; --red:#E05E6B; --green:#5FCB92;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer}
.app{max-width:640px;margin:0 auto;padding:20px 18px 50px}
.hide{display:none!important}

/* ---- 開始畫面 ---- */
.title{font-size:34px;font-weight:800;letter-spacing:.08em;margin:34px 0 4px;text-align:center}
.sub{text-align:center;color:var(--dim);font-size:14px;margin-bottom:34px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{margin:0 0 10px;font-size:16px;letter-spacing:.04em}
.rules{color:var(--dim);font-size:14px;margin:0;padding-left:20px}
.rules li{margin-bottom:5px}
.field{width:100%;background:#120C1B;border:1px solid var(--line);color:var(--ink);
  padding:13px 14px;border-radius:11px;font-size:16px;margin-top:6px}
.big{
  width:100%;margin-top:18px;padding:17px;border:none;border-radius:13px;
  background:var(--violet);color:#fff;font-size:18px;font-weight:700;letter-spacing:.08em;
}
.big:disabled{opacity:.45}
.ghost{background:var(--card2);border:1px solid var(--line);color:var(--ink);font-weight:600}

/* ---- 遊戲 ---- */
.hud{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.clock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;letter-spacing:.02em}
.prog{margin-left:auto;color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:20px}
.fill{height:100%;background:var(--violet);width:0;transition:width .25s}

.qtype{font-size:12px;letter-spacing:.18em;color:var(--violet);font-weight:700;margin-bottom:8px}
.qtext{font-size:20px;font-weight:600;line-height:1.5;margin:0 0 18px;white-space:pre-line}

.audio-box{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:26px 20px;text-align:center;margin-bottom:18px}
.play{width:78px;height:78px;border-radius:50%;border:none;background:var(--violet);
  color:#fff;font-size:28px;display:inline-flex;align-items:center;justify-content:center}
.play.playing{background:var(--violet-d)}
.audio-note{color:var(--dim);font-size:13px;margin-top:12px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  width:100%;text-align:left;padding:16px 18px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);
  font-size:17px;font-weight:500;transition:background .12s,border-color .12s;
}
.opt:hover{border-color:var(--violet-d)}
.opt.wrong{background:#3A1A22;border-color:var(--red);color:#F1AFB6}
.opt.right{background:#183828;border-color:var(--green);color:#A6E8C4}

/* ---- 結算 ---- */
.card-out{
  background:linear-gradient(160deg,#2A1B44,#1A1029);
  border:1px solid var(--violet-d);border-radius:20px;padding:28px 24px;text-align:center;
}
.rank{font-size:13px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.final{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:6px 0 0}
.final span{font-size:22px;font-weight:600;margin-left:4px}
.who{color:var(--dim);font-size:15px;margin-top:10px}
.stats{display:flex;justify-content:center;gap:26px;margin-top:20px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.09)}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.review{margin-top:22px}
.rv{display:flex;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;font-size:14px;align-items:flex-start}
.rv .ic{flex:none;font-weight:700}
.rv.ok .ic{color:var(--green)} .rv.no .ic{color:var(--red)}
.rv .tx{flex:1}
.rv .ans{color:var(--dim);font-size:13px}
.loadwrap{text-align:center;padding:60px 0}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--violet);
  border-radius:50%;margin:0 auto 16px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.fill{transition:none}}
.warn{color:var(--gold);font-size:13.5px;margin-top:10px}

/* ---- 過場 ---- */
.tw{text-align:center;padding:78px 0}
.tw .step{font-size:12px;letter-spacing:.24em;color:var(--dim);font-weight:700}
.tw .nm{font-size:38px;font-weight:800;letter-spacing:.1em;margin:10px 0 22px}
.tw .cnt{font-size:14px;color:var(--dim)}
.tw .paused{margin-top:26px;font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:var(--gold)}
.tw .plabel{font-size:12px;color:var(--dim);letter-spacing:.14em;margin-top:2px}
.clock.hold{color:var(--gold)}
</style>
</head>
<body>
<div class="app">

<!-- ============ 開始 ============ -->
<section id="scStart">
  <div class="title">猜歌競速</div>
  <div class="sub">暫定名稱・測試版</div>
  <div class="panel">
    <h2>玩法</h2>
    <ul class="rules">
      <li>10 題，答對才能進下一題</li>
      <li>從按下開始就計時，比誰用的秒數少</li>
      <li>答錯不扣分，但秒數會一直跑</li>
      <li>聽歌題可以無限重播，也可以聽到一半就作答</li>
    </ul>
    <label style="display:block;margin-top:18px;font-size:14px;color:var(--dim)">暱稱
      <input class="field" id="nick" maxlength="12" placeholder="最多 12 個字">
    </label>
    <button class="big" id="btnStart">開始</button>
    <div id="best" class="audio-note" style="text-align:center"></div>
  </div>
</section>

<!-- ============ 載入 ============ -->
<section id="scLoad" class="hide">
  <div class="loadwrap">
    <div class="spin"></div>
    <div id="loadTxt">準備中…</div>
    <div class="audio-note">正在載入這一輪的音檔，載完才開始計時</div>
    <div id="loadWarn" class="warn"></div>
  </div>
</section>

<!-- ============ 過場 ============ -->
<section id="scGate" class="hide">
  <div class="tw">
    <div class="step" id="gStep"></div>
    <div class="nm" id="gName"></div>
    <div class="cnt" id="gCnt"></div>
    <div class="paused" id="gTime"></div>
    <div class="plabel">計時暫停</div>
  </div>
</section>

<!-- ============ 遊戲 ============ -->
<section id="scPlay" class="hide">
  <div class="hud">
    <div class="clock" id="clock">0.0</div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>

  <div class="qtype" id="qtype"></div>
  <div id="audioBox" class="audio-box hide">
    <button class="play" id="btnPlay">▶</button>
    <div class="audio-note" id="playNote">點一下播放，可以重複聽</div>
  </div>
  <p class="qtext" id="qtext"></p>
  <div class="opts" id="opts"></div>
</section>

<!-- ============ 結算 ============ -->
<section id="scEnd" class="hide">
  <div class="card-out">
    <div class="rank" id="rank"></div>
    <div class="final" id="finalT"></div>
    <div class="who" id="who"></div>
    <div class="stats">
      <div class="stat"><b id="stWrong"></b><span>答錯次數</span></div>
      <div class="stat"><b id="stBest"></b><span>個人最佳</span></div>
    </div>
  </div>
  <button class="big ghost" id="btnAgain">再玩一次</button>
  <div class="review" id="review"></div>
</section>

</div>

   還沒有題目時，這一關會自動跳過。 */
const FILL = [
  {"trackName": "奇蹟", "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/92/fc/80/92fc8045-a91a-9732-49b3-7dfb163ef7bd/mzaf_17853085363296828091.plus.aac.p.m4a", "cutSec": 20.36, "leadIn": 3, "options": ["曾經", "心靈", "自己", "過往"], "answer": "A"},
  {"trackName": "查克靠近", "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/49/3f/20/493f20fc-6d17-0256-47b5-ff0b1666a794/mzaf_915828849477107948.plus.aac.p.m4a", "cutSec": 10.24, "leadIn": 3, "options": ["背影", "手心", "回應", "心情"], "answer": "A"},
  {"trackName": "兩個自己", "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/be/10/f8/be10f86b-5d4f-2568-8404-521a41f8fc9e/mzaf_17607343050215327374.plus.aac.p.m4a", "cutSec": 12.32, "leadIn": 6, "options": ["消息", "話語", "回憶", "現象"], "answer": "A"},
  {"trackName": "回憶的沙漏 (G.E.M.重生版)", "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/1c/52/8d/1c528d09-c542-994f-fdd1-1e594daceff8/mzaf_17176795067299541611.plus.aac.p.m4a", "cutSec": 27.54, "leadIn": 5, "options": ["傷口", "傷痛", "商量", "傷痕"], "answer": "A"},
  {"trackName": "突然之間", "previewUrl": "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/ce/a3/9a/cea39ad9-1724-873d-e99f-efd573db9772/mzaf_3933043911689737911.plus.aac.p.m4a", "cutSec": 9.36, "leadIn": 5, "options": ["理由", "緣由", "你有", "灑脫"], "answer": "A"}
];

/* ---- 稱號（暫定，等你定案再換） ---- */
const RANKS = [
 {max:45, name:"這根本住在她歌單裡"},
 {max:70, name:"骨灰級"},
 {max:100,name:"認真在追的人"},
 {max:150,name:"聽過不少"},
 {max:1e9,name:"再多聽幾遍"}
];

/* ==================================================================
   以下是遊戲程式，平常不用動
   ================================================================== */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
function pick(arr,n){ const c=arr.slice(); const o=[]; while(n-->0 && c.length) o.push(c.splice(rnd(c.length),1)[0]); return o; }
function shuffle(a){ const c=a.slice(); for(let i=c.length-1;i>0;i--){const j=rnd(i+1);[c[i],c[j]]=[c[j],c[i]];} return c; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

/* 關卡順序：文字 → 接字 → 猜歌名 */
const PLAN = [
  {key:"text", name:"問答"},
  {key:"fill", name:"接字"},
  {key:"song", name:"聽歌辨曲"}
];

let stages=[], si=0, qi=0, wrong=0, nick="";
let acc=0, running=false, t0=0, raf=null;
const au = new Audio(); au.preload="auto";
let clipEnd=null, unlocked=false;

let seekWant=null, seekTries=0;
au.addEventListener("timeupdate",()=>{
  if(seekWant!=null){
    if(au.currentTime < seekWant - 0.3 && seekTries < 6){
      seekTries++; try{ au.currentTime = seekWant; }catch(e){} return;
    }
    seekWant = null;
  }
  if(clipEnd!=null && au.currentTime>=clipEnd){ au.pause(); clipEnd=null; setPlay(false); }
});
au.addEventListener("ended",()=>{ clipEnd=null; setPlay(false); });

/* ---------- 計時（過場時真的停下） ---------- */
function secs(){ return (acc + (running? performance.now()-t0 : 0))/1000; }
function tick(){ $("clock").textContent = secs().toFixed(1); raf = requestAnimationFrame(tick); }
function clockStart(){ t0=performance.now(); running=true; cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); }
function clockStop(){ if(running){ acc += performance.now()-t0; running=false; } cancelAnimationFrame(raf); }

/* ---------- 出題 ---------- */
function buildRound(){
  const out=[];

  // 文字題：固定按 組一 → 組二 → 組二 → 組三 → 組四
  const g2 = pick(TEXT.g2,2);
  const textPicked = [ pick(TEXT.g1,1)[0], g2[0], g2[1], pick(TEXT.g3,1)[0], pick(TEXT.g4,1)[0] ].filter(Boolean);
  out.push({key:"text", name:"問答", qs: textPicked.map(t=>({
    kind:"text", q:t.q, opts:shuffle(t.a), ans:t.a[0]
  }))});

  // 接字題：隨機抽 5
  const fillPicked = pick(FILL,5);
  out.push({key:"fill", name:"接字", qs: fillPicked.map(f=>{
    const ansIdx = {A:0,B:1,C:2,D:3}[f.answer] ?? 0;
    return { kind:"fill", data:f, q:"接下來是哪一個字？",
             opts:shuffle(f.options.slice()), ans:f.options[ansIdx] };
  })});

  // 猜歌名：A 抽 1、B 抽 1、C 抽 3
  const usedUrl = new Set(fillPicked.map(f=>f.previewUrl));
  const avail = SONGS.filter(s=>!usedUrl.has(s.url));
  const A=avail.filter(s=>s.tier==="A"), B=avail.filter(s=>s.tier==="B"), C=avail.filter(s=>s.tier==="C");
  const chosen = shuffle([...pick(A,1), ...pick(B,1), ...pick(C,3)]);
  out.push({key:"song", name:"聽歌辨曲", qs: chosen.map(s=>{
    const others = pick(avail.filter(x=>x.song!==s.song).map(x=>x.song),3);
    return { kind:"song", data:s, q:"這是哪一首歌？", opts:shuffle([s.song,...others]), ans:s.song };
  })});

  return out.filter(st=>st.qs.length);   // 沒題目的關直接不出現
}
function allQs(){ return stages.reduce((a,s)=>a.concat(s.qs),[]); }

/* ---------- 預載 ---------- */
function preload(list, done){
  if(!list.length) return done(0);
  let left=list.length, failed=0, fin=false;
  const finish=()=>{ if(!fin){ fin=true; done(failed); } };
  const timer=setTimeout(finish, 15000);
  list.forEach(url=>{
    const a=new Audio(); a.preload="auto"; a.src=url;
    const ok=()=>{ if(--left<=0){ clearTimeout(timer); finish(); } };
    a.addEventListener("canplaythrough", ok, {once:true});
    a.addEventListener("error", ()=>{ failed++; ok(); }, {once:true});
    a.load();
  });
}

/* ---------- 播放 ---------- */
function setPlay(on){ const b=$("btnPlay"); b.textContent=on?"❚❚":"▶"; b.classList.toggle("playing",on); }
function clipRange(q){
  if(q.kind==="song") return [q.data.start, q.data.start+q.data.len];
  const cut=q.data.cutSec, lead=(FILL_LEAD!=null? FILL_LEAD : (q.data.leadIn||6));
  return [Math.max(0,cut-lead), cut];
}
function playClip(){
  const q=stages[si].qs[qi];
  const url = q.kind==="song" ? q.data.url : q.data.previewUrl;
  const [from,to] = clipRange(q);
  clipEnd = to;
  if(au.src!==url) au.src=url;
  seekWant = from; seekTries = 0;
  const go=()=>{ try{ au.currentTime=from; }catch(e){} };
  const p=au.play(); if(p&&p.catch) p.catch(()=>{});
  if(au.readyState>=1) go(); else au.addEventListener("loadedmetadata",go,{once:true});
  au.addEventListener("canplay", go, {once:true});
  setPlay(true);
}
function stopClip(){ au.pause(); clipEnd=null; setPlay(false); }
$("btnPlay").onclick = ()=>{ au.paused ? playClip() : stopClip(); };

/* ---------- 畫面切換 ---------- */
function show(id){ ["scStart","scLoad","scGate","scPlay","scEnd"].forEach(s=>$(s).classList.toggle("hide", s!==id)); }

function gate(){
  clockStop();
  const st = stages[si];
  $("gStep").textContent = "第 "+(si+1)+" 關 / 共 "+stages.length+" 關";
  $("gName").textContent = st.name;
  $("gCnt").textContent = st.qs.length+" 題";
  $("gTime").textContent = secs().toFixed(2)+" 秒";
  show("scGate");
  setTimeout(()=>{ qi=0; clockStart(); show("scPlay"); render(); }, 1500);
}

function render(){
  const st = stages[si], q = st.qs[qi];
  const done = stages.slice(0,si).reduce((n,s)=>n+s.qs.length,0) + qi;
  const total = allQs().length;
  $("prog").textContent = "第 "+(done+1)+" / "+total+" 題";
  $("fill").style.width = (done/total*100)+"%";
  $("qtype").textContent = st.name;
  $("qtext").textContent = q.q;
  const hasAudio = q.kind==="song" || q.kind==="fill";
  $("audioBox").classList.toggle("hide", !hasAudio);
  $("playNote").textContent = q.kind==="fill"
    ? "會播到斷點就停，聽完接下來是哪個字"
    : "點一下播放，可以重複聽";
  const box=$("opts"); box.innerHTML="";
  q.opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=o;
    b.onclick=()=>answer(b,o);
    box.appendChild(b);
  });
  if(hasAudio){ setPlay(false); playClip(); }
}

function answer(btn,val){
  const q = stages[si].qs[qi];
  if(btn.classList.contains("wrong")) return;
  if(val===q.ans){
    btn.classList.add("right");
    stopClip();
    setTimeout(()=>{
      qi++;
      if(qi < stages[si].qs.length){ render(); }
      else { si++; if(si < stages.length) gate(); else finish(); }
    }, 180);
  }else{
    wrong++;
    btn.classList.add("wrong");
    q._missed = (q._missed||0)+1;
  }
}

/* ---------- 結算 ---------- */
function finish(){
  clockStop();
  const s = secs();
  const r = RANKS.find(x=>s<=x.max);
  $("finalT").innerHTML = s.toFixed(2)+'<span>秒</span>';
  $("rank").textContent = r.name;
  $("who").textContent = nick||"";
  $("stWrong").textContent = wrong;

  const prev = parseFloat(store("gem_race_best")||"0");
  const isBest = !prev || s < prev;
  if(isBest) store("gem_race_best", s.toFixed(2));
  $("stBest").textContent = (isBest? s : prev).toFixed(2);

  const rv=$("review"); rv.innerHTML="";
  stages.forEach(st=>{
    st.qs.forEach(q=>{
      const bad=(q._missed||0)>0;
      const d=document.createElement("div");
      d.className="rv "+(bad?"no":"ok");
      d.innerHTML='<span class="ic">'+(bad?"✕":"✓")+'</span><div class="tx"></div>';
      const label = q.kind==="song" ? "聽歌辨曲"
                  : q.kind==="fill" ? ("接字・"+(q.data.trackName||""))
                  : q.q;
      d.querySelector(".tx").innerHTML =
        '<div>'+esc(label)+'</div><div class="ans">'+esc(q.ans)+(bad?"　（錯了 "+q._missed+" 次）":"")+'</div>';
      rv.appendChild(d);
    });
  });
  show("scEnd");
}

/* ---------- 開始 ---------- */
$("btnStart").onclick = ()=>{
  nick = $("nick").value.trim();
  stages = buildRound(); si=0; qi=0; wrong=0; acc=0; running=false;

  // iOS 要在使用者動作當下解鎖音訊
  if(!unlocked){
    const first = allQs().find(q=>q.kind==="song"||q.kind==="fill");
    if(first){
      au.src = first.kind==="song" ? first.data.url : first.data.previewUrl;
      const p=au.play(); if(p&&p.then) p.then(()=>au.pause()).catch(()=>{});
    }
    unlocked = true;
  }

  show("scLoad");
  $("loadWarn").textContent="";
  const urls=[...new Set(allQs().filter(q=>q.kind==="song"||q.kind==="fill")
              .map(q=>q.kind==="song"?q.data.url:q.data.previewUrl))];
  preload(urls, failed=>{
    if(failed) $("loadWarn").textContent="有 "+failed+" 段音檔載入失敗，還是可以玩，播不出來就重整。";
    $("clock").textContent="0.0";
    gate();
  });
};
$("btnAgain").onclick = ()=>{ show("scStart"); refreshBest(); };

function refreshBest(){
  const b = store("gem_race_best");
  $("best").textContent = b ? ("個人最佳　"+b+" 秒") : "";
}
refreshBest();
</script>
